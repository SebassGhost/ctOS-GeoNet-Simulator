<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>ctOS GeoNet Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0b0f14;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #ctos-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .watermark {
      position: absolute;
      bottom: 12px;
      right: 16px;
      color: rgba(0, 255, 204, 0.5);
      font-size: 12px;
      z-index: 3;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="map"></div>
    <canvas id="ctos-canvas"></canvas>
    <div class="watermark">ctOS GeoNet Simulator</div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Script principal -->
  <script type="module" src="src/canvas/overlay.js"></script>
</body>
</html>
